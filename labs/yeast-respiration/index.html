<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محاكاة: تنفس الخميرة</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#2F327D;--orange:#F48C06;--cyan:#65DAFF;--ink:#252641;--muted:#696984;--line:#ECEDF3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Readex Pro",Tahoma,sans-serif;background:linear-gradient(160deg,#F4F7FF,#FFF7EC);color:var(--ink);display:grid;grid-template-columns:1fr 300px;gap:18px;padding:18px;overflow:hidden}
.stage{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(47,50,125,.08);position:relative;overflow:hidden;min-height:0}
canvas{width:100%;height:100%;display:block}
.panel{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(47,50,125,.08);padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto}
h1{font-size:17px;color:var(--navy)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7}
label{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
label b{color:var(--orange)}
input[type=range]{width:100%;accent-color:var(--orange)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:#F7F8FC;border-radius:12px;padding:8px 4px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.meter{background:#F7F8FC;border-radius:14px;padding:12px;text-align:center}
.meter .v{font-size:30px;font-weight:700;color:var(--navy)}
.meter .u{font-size:12px;color:var(--muted)}
.rec{border:0;background:var(--orange);color:#fff;border-radius:30px;padding:10px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 8px 18px rgba(244,140,6,.25)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--muted);font-weight:500}
@media (max-width:640px){body{grid-template-columns:1fr;grid-template-rows:1fr auto;overflow:auto}.stage{min-height:260px}}
</style>
</head>
<body>
<div class="stage"><canvas id="cv"></canvas></div>
<div class="panel">
  <div>
    <h1>تنفس الخميرة</h1>
    <p class="hint">تتنفس الخميرة السكر وتطلق ثاني أكسيد الكربون. عُدّ الفقاعات لتقيس سرعة التنفس.</p>
  </div>
  <div>
    <label>درجة الحرارة <b id="tv">35°C</b></label>
    <input id="t" type="range" min="5" max="65" value="35">
  </div>
  <div>
    <label>كمية السكر</label>
    <div class="seg" id="sugar">
      <button data-v="0">بلا سكر</button><button data-v="1" class="on">ملعقة</button><button data-v="2">ملعقتان</button>
    </div>
  </div>
  <div class="meter"><div class="v" id="rate">0</div><div class="u">فقاعة في الدقيقة</div></div>
  <button class="rec" id="recBtn">سجّل القراءة</button>
  <table><thead><tr><th>الحرارة</th><th>السكر</th><th>الفقاعات/دقيقة</th></tr></thead><tbody id="log"></tbody></table>
  <p class="hint" id="note"></p>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,dpr=window.devicePixelRatio||1;
function size(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();
let T=35,sugar=1;
const sugarName=['بلا سكر','ملعقة','ملعقتان'];
// rate model: enzyme activity rises with temperature, peaks near 35-40°C, falls sharply when enzymes denature
function rate(){
  if(sugar===0) return 0;
  let f=T<=38? Math.exp(-Math.pow((T-38)/16,2)) : Math.max(0,1-Math.pow((T-38)/18,2));
  return Math.round(f*(sugar===1?22:34));
}
function note(){
  const n=document.getElementById('note');
  if(sugar===0) n.textContent='بلا سكر لا تجد الخميرة غذاءً تفككه، فلا ينتج ثاني أكسيد الكربون.';
  else if(T>=55) n.textContent='الحرارة العالية تُتلف إنزيمات الخميرة، فيتوقف التنفس تقريبًا.';
  else if(T<=12) n.textContent='في البرودة تبطؤ الإنزيمات، فيقل إنتاج الفقاعات.';
  else n.textContent='لاحظ: أعلى معدل قريب من درجة حرارة الجسم.';
}
const tIn=document.getElementById('t');
tIn.oninput=()=>{T=+tIn.value;document.getElementById('tv').textContent=T+'°C';update()};
document.querySelectorAll('#sugar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#sugar button').forEach(x=>x.classList.remove('on'));b.classList.add('on');sugar=+b.dataset.v;update()});
function update(){document.getElementById('rate').textContent=rate();note()}
document.getElementById('recBtn').onclick=()=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${T}°C</td><td>${sugarName[sugar]}</td><td><b>${rate()}</b></td>`;document.getElementById('log').prepend(tr)};
update();

const bubbles=[];let acc=0,last=performance.now();
function draw(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  ctx.clearRect(0,0,W,H);
  const cx=W*.36, base=H*.86, fw=Math.min(W*.34,220), fh=Math.min(H*.5,240);
  // water beaker
  const bx=W*.62,bw=Math.min(W*.26,170),bh=Math.min(H*.42,200);
  ctx.fillStyle='#EAF6FF';ctx.strokeStyle='#9CCBEA';ctx.lineWidth=3;
  ctx.beginPath();ctx.roundRect(bx,base-bh,bw,bh,[0,0,16,16]);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(101,218,255,.35)';ctx.fillRect(bx+3,base-bh*.75,bw-6,bh*.75-3);
  // flask
  const temp=Math.min(1,Math.max(0,(T-5)/60));
  const col=`hsl(${35-temp*30},${70}%,${88-temp*18}%)`;
  ctx.fillStyle=col;ctx.strokeStyle='#2F327D';ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(cx-fw*.14,base-fh);ctx.lineTo(cx-fw*.14,base-fh*.6);ctx.lineTo(cx-fw*.5,base-8);
  ctx.quadraticCurveTo(cx-fw*.5,base,cx-fw*.42,base);ctx.lineTo(cx+fw*.42,base);
  ctx.quadraticCurveTo(cx+fw*.5,base,cx+fw*.5,base-8);ctx.lineTo(cx+fw*.14,base-fh*.6);ctx.lineTo(cx+fw*.14,base-fh);
  ctx.closePath();ctx.fill();ctx.stroke();
  // yeast dots
  ctx.fillStyle='rgba(164,113,72,.55)';
  for(let i=0;i<40;i++){const a=i*2.39996,r=(i%7)/7;ctx.beginPath();ctx.arc(cx+Math.cos(a)*fw*.3*r,base-20-((i*37)%60)*.6,2.6,0,7);ctx.fill()}
  // tube
  ctx.strokeStyle='#2F327D';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,base-fh);ctx.lineTo(cx,base-fh-30);ctx.quadraticCurveTo(cx,base-fh-50,cx+30,base-fh-50);
  ctx.lineTo(bx+bw*.5-20,base-fh-50);ctx.quadraticCurveTo(bx+bw*.5,base-fh-50,bx+bw*.5,base-fh-30);ctx.lineTo(bx+bw*.5,base-24);ctx.stroke();
  // bubbles
  const r=rate();acc+=dt*r/60*6;
  while(acc>=1){acc--;bubbles.push({x:bx+bw*.5+(Math.random()-.5)*6,y:base-26,s:3+Math.random()*4,v:40+Math.random()*30})}
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.strokeStyle='#2F80ED';ctx.lineWidth=1.5;
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.y-=b.v*dt;b.x+=Math.sin(b.y/9)*.3;
    if(b.y<base-bh*.75){bubbles.splice(i,1);continue}
    ctx.beginPath();ctx.arc(b.x,b.y,b.s,0,7);ctx.fill();ctx.stroke()}
  // labels
  ctx.fillStyle='#696984';ctx.font='13px Readex Pro, Tahoma';ctx.textAlign='center';
  ctx.fillText('خميرة + ماء + سكر',cx,base+22);ctx.fillText('ماء',bx+bw/2,base+22);
  ctx.fillStyle='#F48C06';ctx.font='600 14px Readex Pro, Tahoma';ctx.fillText(T+'°C',cx,base-fh-62);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
